# ═══════════════════════════════════════════════════════════════
#  CI Pipeline — egitim-ci-demo
#  Katmanlar:
#    1. [Paralel] lint + test + secret-scan
#    2. docker-build  (hepsi geçince)
#    3. security-scan (build sonrası)
#    4. push          (sadece main branch'te → GHCR)
# ═══════════════════════════════════════════════════════════════
name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Hedef ortam'
        required: true
        type: choice
        options: [dev, staging, production]
        default: dev

# Aynı branch'e hızlı push gelirse eskiyi iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Global environment değişkenleri ──────────────────────────
env:
  NODE_VERSION: '20'
  IMAGE_NAME:   egitim-ci-demo
  ENVIRONMENT:  ${{ github.event.inputs.environment || 'dev' }}
  # GHCR tam image path'i — tüm job'larda kullanılır
  FULL_IMAGE:   ghcr.io/${{ github.repository_owner }}/egitim-ci-demo

jobs:

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 1-A — Lint                                       ║
  # ╚══════════════════════════════════════════════════════════╝
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: ESLint Çalıştır
        run: npm run lint

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 1-B — Test                                       ║
  # ╚══════════════════════════════════════════════════════════╝
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Testleri Çalıştır (Coverage ile)
        run: npm test
        env:
          NODE_ENV: test

      - name: Coverage Raporunu Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 1-C — Secret Scan                                ║
  # ╚══════════════════════════════════════════════════════════╝
  secret-scan:
    name: 🔑 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # tüm git history — gitleaks için

      - name: Gitleaks ile Secret Tara
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 2 — Docker Build                                 ║
  # ║  (lint + test + secret-scan hepsi geçince başlar)        ║
  # ╚══════════════════════════════════════════════════════════╝
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan]

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags:   ${{ steps.meta.outputs.tags }}

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: Image Metadata Oluştur
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Docker Image Build Et (Push Olmadan)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false                         # sadece build — push sonraki katmanda
          tags: ${{ env.FULL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          load: true                          # local docker'a yükle (scan için)

      - name: Image Boyutunu Göster
        run: |
          echo "📦 Image boyutu:"
          docker image inspect ${{ env.FULL_IMAGE }}:${{ github.sha }} \
            --format='{{.Size}}' | numfmt --to=iec

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 3 — Security Scan                                ║
  # ╚══════════════════════════════════════════════════════════╝
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      security-events: write                  # SARIF upload için

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: Image'ı Tekrar Build Et (Scan için — cache'ten gelir)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.FULL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha               # cache'ten gelir — hızlı!
          load: true

      - name: Trivy ile Container Tara
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:  '${{ env.FULL_IMAGE }}:${{ github.sha }}'
          format:     sarif
          output:     trivy-results.sarif
          severity:   CRITICAL,HIGH
          exit-code:  '1'                    # CRITICAL/HIGH varsa pipeline dur!

      - name: Trivy Sonuçlarını GitHub Security Tab'a Yükle
        uses: github/codeql-action/upload-sarif@v3
        if: always()                          # hata olsa bile yükle
        with:
          sarif_file: trivy-results.sarif

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 4 — GHCR Push                                    ║
  # ║  Sadece main branch'te çalışır                           ║
  # ║  GITHUB_TOKEN ile auth — ekstra secret gerekmez!         ║
  # ╚══════════════════════════════════════════════════════════╝
  push:
    name: 🚀 Push to GHCR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents:  read
      packages:  write                        # GHCR push için zorunlu

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: GHCR'a Login Ol
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}       # kim push ettiyse o
          password: ${{ secrets.GITHUB_TOKEN }} # otomatik token — secret gerekmez

      - name: Image Tag'lerini Oluştur
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            # Commit SHA → ghcr.io/.../egitim-ci-demo:sha-a1b2c3d
            type=sha,prefix=sha-,format=short
            # Branch adı → ghcr.io/.../egitim-ci-demo:main
            type=ref,event=branch
            # Semver (git tag'i varsa) → ghcr.io/.../egitim-ci-demo:1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Her zaman latest (sadece main'de)
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Build Et ve GHCR'a Push Yap
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64  # multi-platform
          push:      true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha               # önceki build cache'inden gelir
          cache-to:   type=gha,mode=max

      - name: Push Özeti
        run: |
          echo "## ✅ GHCR Push Başarılı!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Alan | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📍 Registry | \`ghcr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Image | \`${{ env.FULL_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Digest | \`${{ steps.build-push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Actor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 Run | [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY