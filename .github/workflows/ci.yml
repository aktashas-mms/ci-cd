# ═══════════════════════════════════════════════════════════════
#  CI/CD Pipeline — ci-cd
#  Katmanlar:
#    1. [Paralel] lint + test + secret-scan
#    2. docker-build  (hepsi geçince)
#    3. security-scan (build sonrası)
#    4. push          (sadece main branch'te → GHCR)
#    5. flux-update   (FluxCD repo'yu güncelle → otomatik deploy)
# ═══════════════════════════════════════════════════════════════
name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Hedef ortam'
        required: true
        type: choice
        options: [dev, staging, production]
        default: dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  IMAGE_NAME:   egitim-ci-demo
  ENVIRONMENT:  ${{ github.event.inputs.environment || 'dev' }}
  # ✅ DÜZELTİLDİ — lowercase zorunlu GHCR için
  FULL_IMAGE:   ghcr.io/${{ github.repository_owner }}/egitim-ci-demo

jobs:

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 1-A — Lint                                       ║
  # ╚══════════════════════════════════════════════════════════╝
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: ESLint Çalıştır
        run: npm run lint

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 1-B — Test                                       ║
  # ╚══════════════════════════════════════════════════════════╝
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Testleri Çalıştır (Coverage ile)
        run: npm test
        env:
          NODE_ENV: test

      - name: Coverage Raporunu Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 1-C — Secret Scan                                ║
  # ╚══════════════════════════════════════════════════════════╝
  secret-scan:
    name: 🔑 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks ile Secret Tara
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 2 — Docker Build                                 ║
  # ╚══════════════════════════════════════════════════════════╝
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan]

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags:   ${{ steps.meta.outputs.tags }}

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: Image Metadata Oluştur
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr

      - name: Docker Image Build Et (Push Olmadan)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.FULL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          load: true

      - name: Image Boyutunu Göster
        run: |
          echo "📦 Image boyutu:"
          docker image inspect ${{ env.FULL_IMAGE }}:${{ github.sha }} \
            --format='{{.Size}}' | numfmt --to=iec

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 3 — Security Scan                                ║
  # ╚══════════════════════════════════════════════════════════╝
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      security-events: write

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: Image'ı Tekrar Build Et (cache'ten — hızlı)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.FULL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          load: true

      - name: Trivy ile Container Tara
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.FULL_IMAGE }}:${{ github.sha }}'
          format:    sarif
          output:    trivy-results.sarif
          severity:  CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy Sonuçlarını GitHub Security Tab'a Yükle
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 4 — GHCR Push                                    ║
  # ╚══════════════════════════════════════════════════════════╝
  push:
    name: 🚀 Push to GHCR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    outputs:
      # ✅ image-tag downstream job'lara aktarılıyor
      image-tag:    ${{ steps.image-tag.outputs.tag }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: GHCR'a Login Ol
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ YENİ — tag'i output olarak kaydet
      - name: Image Tag Belirle
        id: image-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "📌 Image tag: sha-${SHORT_SHA}"

      - name: Image Tag'lerini Oluştur
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Build Et ve GHCR'a Push Yap
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push:      true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Push Özeti
        run: |
          echo "## ✅ GHCR Push Başarılı!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Alan | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📍 Registry | \`ghcr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Image | \`${{ env.FULL_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Tag | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Digest | \`${{ steps.build-push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Actor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 Run | [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY

  # ╔══════════════════════════════════════════════════════════╗
  # ║  KATMAN 5 — FluxCD GitOps Update               🆕        ║
  # ║  push başarılıysa → FluxCD repo'yu güncelle             ║
  # ║  Flux fark eder → otomatik cluster'a deploy eder        ║
  # ╚══════════════════════════════════════════════════════════╝
  flux-update:
    name: 🔄 FluxCD GitOps Update
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: FluxCD Repo'yu Klonla
        uses: actions/checkout@v4
        with:
          repository: aktashas-mms/fluxcd           # ✅ FluxCD repo
          token: ${{ secrets.FLUX_REPO_TOKEN }}      # ✅ Write yetkili PAT
          path: fluxcd-repo

      - name: Image Tag'ini Güncelle
        run: |
          cd fluxcd-repo

          # Gelen tag'i al (push job'undan)
          NEW_TAG="${{ needs.push.outputs.image-tag }}"
          echo "📌 Yeni image tag: ${NEW_TAG}"

          # Mevcut tag'i göster
          echo "📍 Mevcut:"
          grep "image:" apps/base/egitim-ci-demo/deployment.yaml

          # ✅ Sadece tag kısmını değiştir — comment'e dokunma
          sed -i "s|image: ghcr.io/aktashas-mms/egitim-ci-demo:.*|image: ghcr.io/aktashas-mms/egitim-ci-demo:${NEW_TAG}  # {\"\\$imagepolicy\": \"flux-system:egitim-ci-demo\"}|g" \
            apps/base/egitim-ci-demo/deployment.yaml

          echo "✅ Güncel:"
          grep "image:" apps/base/egitim-ci-demo/deployment.yaml

      - name: Git Commit ve Push
        run: |
          cd fluxcd-repo

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/base/egitim-ci-demo/deployment.yaml

          # Değişiklik yoksa çık
          if git diff --staged --quiet; then
            echo "⚠️  Aynı tag — değişiklik yok, skip"
            exit 0
          fi

          git commit -m "chore: update egitim-ci-demo → ${{ needs.push.outputs.image-tag }}

          Source Repo : ${{ github.repository }}
          Commit      : ${{ github.sha }}
          Actor       : ${{ github.actor }}
          Run         : #${{ github.run_number }}
          Digest      : ${{ needs.push.outputs.image-digest }}"

          git push origin main

      - name: FluxCD Update Özeti
        run: |
          echo "## 🔄 FluxCD GitOps Update Başarılı!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Alan | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Image Tag | \`${{ needs.push.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Digest | \`${{ needs.push.outputs.image-digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 FluxCD Repo | \`aktashas-mms/fluxcd\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Deploy ETA | ~1 dakika |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Flux Repo | [aktashas-mms/fluxcd](https://github.com/aktashas-mms/fluxcd/commits/main) |" >> $GITHUB_STEP_SUMMARY